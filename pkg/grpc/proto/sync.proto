syntax = "proto3";

package gophkeeper.v1;

import "google/protobuf/empty.proto";

option go_package = "gophkeeper/pkg/grpc/sync";

message RecordChange {
  string id = 1;               // UUID
  int32  kind = 2;             // 1..4
  int64  updated_at_unix = 3;  // ms, UTC (LWW)
  bytes  payload = 4;          // nonce||ciphertext||tag
  string operation_id = 5;     // UUID (idempotency)
}

// Requires Authorization: Bearer <access_token>
service SyncService {
  rpc Pull(PullRequest) returns (PullResponse);
  rpc Push(PushRequest) returns (PushResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message PullRequest {
  int64 cursor = 1; // server_seq
  int32 limit = 2;
}

message PullResponse {
  repeated RecordChange changes = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

message PushRequest {
  repeated RecordChange changes = 1;
}

message PushResponse {
  repeated PushResult results = 1;
}

message PushResult {
  string record_id = 1;
  PushStatus status = 2;
}

enum PushStatus {
  PUSH_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;
  STALE = 2;  // server has a newer version
}
